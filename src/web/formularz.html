    <nav>

    <main>
        <h2>FORMULARZ KONTAKTOWY</h2>

        <form id="form" action="zasob.php" method="POST">

            <label for="name">Wpisz swoje imie:</label> <br>
            <input type="text" id="name" name="name" required>

            <br>

            <label for="password">Wpisz swoje hasło:</label> <br>
            <input type="password" id="password" name="password" required>

            <br>
            <hr>

            <label for="password2">Wpisz swoje hasło ponownie:</label> <br>
            <input type="password" id="password2" name="password2" required>

            <br>

            <label for="file">Twój załącznik:</label><br>
            <input type="file" id="file" name="file" required>

            <br>
            <hr>

            <input type="submit"  value="Wyślij">
            <input type="reset" value="Wyczyść">

        </form>

    </main>


    <footer>
        <span id="footer_down">
            Jeśli masz jakiekolwiek pytania proszę zajrzyj do zakładki "Kontakt"
        </span>
    </footer>

</div>


<script>
    document.getElementById('form').addEventListener('submit' , function(event) {
        const pass1 = document.getElementById('password').value;
        const pass2 = document.getElementById('password2').value;

        if (pass1 !== pass2) {
            event.preventDefault();
            alert('Passwords must match');
        }
    })
</script>
