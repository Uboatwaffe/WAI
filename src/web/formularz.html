    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="container">
    <header>
        <h1 class="centered title">
            Żeglarstwo
        </h1>
    </header>

    <nav>

        <a href="index.html">
            <div class="item">
                <p class="centered">
                    Strona główna
                </p>
            </div>
        </a>

        <a href="galeria.html">
            <div class="item">
                <p class="centered">
                    Galeria
                </p>
            </div>

        </a>

        <div class="item">
            <p class="centered">
                Kontakt
            </p>
            <div class="drop_down">
                <hr>
                <a href="formularz.html">
                    <div>
                        Formularz
                    </div>
                </a>
                <hr>
                <a href="adres.html">
                    <div>
                        Adres
                    </div>
                </a>
                <hr>
            </div>

        </div>


    </nav>

    <main>
        <h2>FORMULARZ KONTAKTOWY</h2>

        <form action="zasob.php" method="POST">

            <label>
                Wpisz swoje imie: <br>
                <input type="text" name="name">
            </label>
            <br>
            <label>
                Wpisz swoje nazwisko: <br>
                <input type="text" name="surname">
            </label>
            <br>
            <hr>
            <label>
                Wpisz hasło do twojego konta: <br>
                <input type="password" name="password">
            </label>
            <br>
            <label>
                Twój email: <br>
                <input type="email" name="email">
            </label>
            <br>
            <hr>
            <label>
                Wprowadź date spotkania która ci najbardziej pasuje: <br>
                <input type="date" name="date">
            </label>
            <br>
            <label>
                Ile masz spraw do załatwienia: <br>
                <select name="how_many_tasks">
                    <option value="one">Jedną</option>
                    <option value="two">Dwie</option>
                    <option value="three">Więcej niż trzy</option>
                </select>
            </label>
            <br>
            <hr>
            <label>
                Jestem klientem prywatnym: <br>
                Tak
                <input type="radio" name="private" value="yes" checked>
            </label>
            <label>
                Nie
            <input type="radio" name="private" value="no">
            </label>
            <br>
            <br>
            <label>
                Mam sprawę związaną z: <br>
                Stroną internetową
                <input type="checkbox" name="website"> <br>
            </label>
            <label>
                Sklepem stacjonarnym
                <input type="checkbox" name="shop">
            </label>
            <br>
            <hr>
            <input type="submit"  value="Wyślij">
            <input type="reset" value="Wyczyść">

        </form>

    </main>


    <footer>
        <span id="footer_down">
            Jeśli masz jakiekolwiek pytania proszę zajrzyj do zakładki "Kontakt"
        </span>
    </footer>

</div>


</body>
